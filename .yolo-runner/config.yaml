default_profile: beads
profiles:
  tk:
    tracker:
      type: tk
  beads:
    tracker:
      type: beads
  github:
    tracker:
      type: github
      github:
        scope:
          owner: egv
          repo: yolo-runner
        auth:
          token_env: GITHUB_TOKEN
  startrek-poc:
    tracker:
      type: startrek
      startrek:
        endpoint: https://st-api.yandex-team.ru/v3
        token_env: STARTREK_TOKEN
        queues:
          - key: VAY
            root: /home/genaevstratov/arcadia
          - key: LUMI
            root: .yolo-runner/arc-mounts/lumi
            arc_mount:
              enabled: true
              store: .yolo-runner/arc-stores/lumi/store
              object_store: .yolo-runner/arc-stores/shared-store
              allow_other: true
              ssh_tokens: true
              inode_cache_size: 100000
              cache_size: 134217728
agent:
  backend: codex
  model: gpt-5.5
  concurrency: 1
  runner_timeout: 20m
  watchdog_timeout: 10m
  watchdog_interval: 5s
  retry_budget: 5
tracker_agent:
  poll_interval: 30s
  lock_path: .yolo-runner/tracker-agent.lock
  labels:
    ready: yolo-agent-ready
    in_progress: yolo-agent-in-progress
    completed: yolo-agent-completed
    blocked: yolo-agent-blocked
    failed: yolo-agent-failed
landing:
  type: arc-pr
  title_template: "Land {{ .TaskID }}: {{ .TaskTitle }}"
