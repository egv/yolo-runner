default_profile: beads
arc_review_watch:
  reviewer: genaevstratov
  allow_ship: false
  poll_interval: 2m
profiles:
  tk:
    tracker:
      type: tk
  beads:
    tracker:
      type: beads
  github:
    tracker:
      type: github
      github:
        scope:
          owner: egv
          repo: yolo-runner
        auth:
          token_env: GITHUB_TOKEN
  startrek-poc:
    tracker:
      type: startrek
      startrek:
        endpoint: https://st-api.yandex-team.ru/v3
        token_env: STARTREK_TOKEN
        queues:
          - key: VAY
            assignee: genaevstratov
            root: /home/genaevstratov/arcadia
          - key: LUMI
            assignee: genaevstratov
            root: .yolo-runner/arc-mounts/lumi
            arc_mount:
              enabled: true
              store: .yolo-runner/arc-stores/lumi/store
              object_store: .yolo-runner/arc-stores/shared-store
              allow_other: true
              ssh_tokens: true
              inode_cache_size: 100000
              cache_size: 134217728
  startrek-adapta:
    tracker:
      type: startrek
      startrek:
        endpoint: https://st-api.yandex-team.ru/v3
        token_env: STARTREK_TOKEN
        queues:
          - key: ADAPTABOT
            assignee: genaevstratov
            root: /home/genaevstratov/arcadia
          - key: LUMI
            assignee: genaevstratov
            preset: startrek-lumi
            root: /home/genaevstratov/arcadia/marvel/gena/lumi
            arc_mount:
              enabled: true
              store: .yolo-runner/arc-stores/lumi/store
              object_store: .yolo-runner/arc-stores/shared-store
              allow_other: true
              ssh_tokens: true
              inode_cache_size: 100000
              cache_size: 134217728
agent:
  backend: codex
  model: gpt-5.5
  concurrency: 1
  runner_timeout: 20m
  watchdog_timeout: 10m
  watchdog_interval: 5s
  retry_budget: 5
tracker_agent:
  poll_interval: 30s
  lock_path: .yolo-runner/tracker-agent.lock
  status_transitions:
    in_progress: start_progress
    blocked: need_info
    ready: provide_info
    completed: close
    completed_resolution: fixed
landing:
  type: git
  title_template: "Land {{ .TaskID }}: {{ .TaskTitle }}"
watch:
  queue_path: .yolo-runner/watch.db
  sources:
    - name: startrek-adapta
      type: startrek
      profile: startrek-adapta
    - name: arcpr
      type: arcpr
      profile: arcpr
  runner_pools:
    - name: startrek-adapta-implementers
      source: startrek-adapta
      presets: [startrek-adapta, startrek-lumi]
      min_replicas: 1
      max_replicas: 2
      capacity: 1
    - name: arcpr-reviewers
      source: arcpr
      presets: [arcpr]
      min_replicas: 1
      max_replicas: 2
      capacity: 2
  autoscale:
    min_runners: 2
    max_runners: 4
  tui:
    default_mode: stream
