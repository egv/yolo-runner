name: codex
type: codex
backend: codex
model: gpt-5.6-sol
binary: codex
args:
  - "-c"
  - 'model_reasoning_effort="medium"'
  - "app-server"
capabilities:
  languages:
    - go
    - python
    - typescript
  features:
    - implement
    - review
    - stream
    - larger_model
    - service_proxy
config:
  timeout: 45s
health:
  enabled: true
  endpoint: http://localhost:0/healthz
  interval: 5s
  timeout: 2s
adapter: codex-app-server
supports_review: true
supports_stream: true
